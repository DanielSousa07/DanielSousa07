name: Gerar GitHub Stats

on:
  schedule:
    # Roda automaticamente todos os dias à meia-noite
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite rodar manualmente

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Gerar Card de Estatísticas Principais
        uses: stats-organization/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: stats
          # Aqui passamos as configurações como se fosse uma URL
          options: theme=dracula&show_icons=true&include_all_commits=true&count_private=true&hide_border=true
          path: images/github-stats.svg

      - name: Gerar Card de Linguagens
        uses: stats-organization/github-readme-stats-action@v1
        with:
          token: ${{ secrets.MEU_TOKEN_STATS }}
          card: top-langs
          options: layout=compact&langs_count=6&theme=dracula&hide_border=true
          path: images/top-langs.svg

      - name: Commitar as novas imagens
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "chore: atualiza status do github [skip ci]" || exit 0
          git push
